name: Daily volatility forecast

on:
  schedule:
    # 22:30 UTC on weekdays, after the US market close (4 pm New York) in both summer and winter time.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Generate forecasts
        run: python pipeline/forecast.py

      - name: Commit updated forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/forecasts.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update volatility forecasts ($(date -u +%Y-%m-%d))"
            git push
          fi
